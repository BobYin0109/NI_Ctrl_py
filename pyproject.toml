[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ni-ctrl-py"
version = "0.1.0"
description = "Step-and-shoot PI E-727 stage control with NI PCIe-6353 CMOS triggering."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "NI_Ctrl_py" }
]
dependencies = []

[project.optional-dependencies]
hardware = [
  "pipython>=2.10.0",
  "nidaqmx>=0.9.0"
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0"
]

[project.scripts]
ni-ctrl = "ni_ctrl_py.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []
